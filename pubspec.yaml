name: language_learning_app
description: Application de révision de langues avec roue interactive

# 📝 Scripts disponibles :
# - Générer le manifest des decks : dart run tool/generate_deck_manifest.dart
# - Ou utiliser le Makefile : make generate-manifest

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0' 

dependencies:
  flutter:
    sdk: flutter

  # Multilingue
  flutter_localizations:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Stockage local
  shared_preferences: ^2.3.3
  
  # JSON Serialization
  json_annotation: ^4.9.0
  
  # UUID pour les IDs uniques
  uuid: ^4.5.1
  
  # Utilitaires date/heure
  intl: ^0.20.2

  # Drapeaux des pays
  country_flags: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0
  
  # Code generation pour JSON
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/decks/
    - assets/decks/chinese/
    - assets/decks/chinese/hsk1/
    - assets/decks/chinese/hsk1/part1-5/
    - assets/decks/chinese/hsk1/part6-10/
    - assets/decks/chinese/hsk1/part11-15/
    - assets/decks/english/a2_key/
  
  generate: true